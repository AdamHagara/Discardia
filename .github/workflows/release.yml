name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  jar:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build fat JAR
        run: ./gradlew lwjgl3:jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: lwjgl3/build/libs/*.jar

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Windows executable
        run: ./gradlew lwjgl3:packageWinX64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lwjgl3/build/construo/dist/

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Linux binary
        run: ./gradlew lwjgl3:packageLinuxX64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: lwjgl3/build/construo/dist/

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build macOS binary
        run: ./gradlew lwjgl3:packageMacM1
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: lwjgl3/build/construo/dist/

  release:
    name: Create Release
    needs: [jar, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Discardia ${{ github.ref_name }}"
          body: |
            ## Stiahnutie

            | Platforma | Súbor | Poznámka |
            |-----------|-------|----------|
            | Windows | `*-windows.zip` | Rozbaľ a spusti `Discardia.exe` |
            | Linux | `*-linux.zip` | Rozbaľ a spusti `Discardia` |
            | macOS (Apple Silicon) | `*-mac*.zip` | Rozbaľ a spusti `Discardia` |
            | Všetky OS (JAR) | `Discardia-1.0.0.jar` | Potrebuje [Java 21](https://adoptium.net/) |
          files: |
            artifacts/windows/*.zip
            artifacts/linux/*.zip
            artifacts/macos/*.zip
            artifacts/jar/*.jar
